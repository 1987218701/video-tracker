<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 视频追剧记录</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <style>
        [v-cloak] { display: none; }
    </style>
</head>
<body>
    <div id="app" v-cloak>
        <el-container class="app-container">
            <el-header class="app-header">
                <div class="header-content">
                    <h1 class="app-title">🎬 视频追剧记录</h1>
                    <div class="stats-bar">
                        <stat-card label="总计" :value="stats.total" color="#409EFF"></stat-card>
                        <stat-card label="在看" :value="stats.watching" color="#409EFF"></stat-card>
                        <stat-card label="已看完" :value="stats.completed" color="#67C23A"></stat-card>
                        <stat-card label="想看" :value="stats.plan" color="#E6A23C"></stat-card>
                        <stat-card label="弃剧" :value="stats.dropped" color="#F56C6C"></stat-card>
                    </div>
                </div>
            </el-header>
            
            <el-main class="app-main">
                <el-card class="toolbar-card" shadow="hover">
                    <el-row :gutter="20" class="toolbar">
                        <el-col :xs="24" :sm="12" :md="8">
                            <el-input
                                v-model="filters.keyword"
                                placeholder="搜索视频名称..."
                                prefix-icon="Search"
                                clearable
                                @input="debounceLoadVideos"
                            ></el-input>
                        </el-col>
                        <el-col :xs="12" :sm="6" :md="4">
                            <el-select v-model="filters.category" placeholder="全部分类" clearable style="width: 100%" @change="loadVideos">
                                <el-option label="电视剧" value="电视剧"></el-option>
                                <el-option label="电影" value="电影"></el-option>
                                <el-option label="动漫" value="动漫"></el-option>
                                <el-option label="综艺" value="综艺"></el-option>
                                <el-option label="纪录片" value="纪录片"></el-option>
                                <el-option label="其他" value="其他"></el-option>
                            </el-select>
                        </el-col>
                        <el-col :xs="12" :sm="6" :md="4">
                            <el-select v-model="filters.status" placeholder="全部状态" clearable style="width: 100%" @change="loadVideos">
                                <el-option label="在看" value="在看"></el-option>
                                <el-option label="已看完" value="已看完"></el-option>
                                <el-option label="想看" value="想看"></el-option>
                                <el-option label="弃剧" value="弃剧"></el-option>
                            </el-select>
                        </el-col>
                        <el-col :xs="24" :sm="24" :md="8" class="add-btn-col">
                            <el-button type="primary" @click="openModal()">➕ 添加记录</el-button>
                        </el-col>
                    </el-row>
                </el-card>
                
                <div class="video-list" v-loading="loading">
                    <el-empty v-if="!loading && videos.length === 0" description="还没有记录，点击\"添加记录\"开始吧！"></el-empty>
                    <el-row :gutter="20">
                        <el-col :xs="24" :sm="12" :md="8" :lg="6" v-for="video in videos" :key="video.id" style="margin-bottom: 20px">
                            <video-card
                                :video="video"
                                @edit="editVideo"
                                @delete="confirmDelete"
                            ></video-card>
                        </el-col>
                    </el-row>
                </div>
            </el-main>
        </el-container>
        
        <el-dialog
            v-model="dialogVisible"
            :title="editingVideo ? '编辑视频记录' : '添加视频记录'"
            width="600px"
            :close-on-click-modal="false"
        >
            <el-form :model="form" ref="formRef" :rules="rules" label-width="100px">
                <el-form-item label="标题" prop="title">
                    <el-input v-model="form.title" placeholder="视频名称"></el-input>
                </el-form-item>
                <el-row :gutter="20">
                    <el-col :span="12">
                        <el-form-item label="分类" prop="category">
                            <el-select v-model="form.category" style="width: 100%">
                                <el-option label="电视剧" value="电视剧"></el-option>
                                <el-option label="电影" value="电影"></el-option>
                                <el-option label="动漫" value="动漫"></el-option>
                                <el-option label="综艺" value="综艺"></el-option>
                                <el-option label="纪录片" value="纪录片"></el-option>
                                <el-option label="其他" value="其他"></el-option>
                            </el-select>
                        </el-form-item>
                    </el-col>
                    <el-col :span="12">
                        <el-form-item label="状态" prop="status">
                            <el-select v-model="form.status" style="width: 100%">
                                <el-option label="在看" value="在看"></el-option>
                                <el-option label="已看完" value="已看完"></el-option>
                                <el-option label="想看" value="想看"></el-option>
                                <el-option label="弃剧" value="弃剧"></el-option>
                            </el-select>
                        </el-form-item>
                    </el-col>
                </el-row>
                <el-divider content-position="left">剧集进度</el-divider>
                <el-row :gutter="20">
                    <el-col :span="12">
                        <el-form-item label="总集数">
                            <el-input-number v-model="form.total_episodes" :min="0" style="width: 100%" placeholder="如: 24"></el-input-number>
                        </el-form-item>
                    </el-col>
                    <el-col :span="12">
                        <el-form-item label="当前看到">
                            <el-input-number v-model="form.current_episode" :min="0" style="width: 100%" placeholder="如: 12"></el-input-number>
                        </el-form-item>
                    </el-col>
                </el-row>
                <el-divider content-position="left">时长进度（电影用）</el-divider>
                <el-row :gutter="20">
                    <el-col :span="12">
                        <el-form-item label="总时长">
                            <el-input-number v-model="form.total_duration_min" :min="0" style="width: 100%" placeholder="分钟"></el-input-number>
                        </el-form-item>
                    </el-col>
                    <el-col :span="12">
                        <el-form-item label="已看时长">
                            <el-input-number v-model="form.current_duration_min" :min="0" style="width: 100%" placeholder="分钟"></el-input-number>
                        </el-form-item>
                    </el-col>
                </el-row>
                <el-form-item label="评分">
                    <el-rate
                        v-model="form.rating"
                        :max="10"
                        show-score
                        text-color="#ff9900"
                        score-template="{value}"
                        allow-half
                    ></el-rate>
                </el-form-item>
                <el-form-item label="备注">
                    <el-input v-model="form.note" type="textarea" :rows="3" placeholder="可选备注"></el-input>
                </el-form-item>
            </el-form>
            <template #footer>
                <el-button @click="dialogVisible = false">取消</el-button>
                <el-button type="primary" @click="saveVideo" :loading="saving">保存</el-button>
            </template>
        </el-dialog>
        
        <el-dialog
            v-model="deleteDialogVisible"
            title="确认删除"
            width="450px"
        >
            <p>确定要删除「<strong>{{ deletingVideo?.title }}</strong>」吗？此操作不可撤销。</p>
            <template #footer>
                <el-button @click="deleteDialogVisible = false">取消</el-button>
                <el-button type="danger" @click="deleteVideo" :loading="deleting">删除</el-button>
            </template>
        </el-dialog>
    </div>
    
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus"></script>
    <script src="https://unpkg.com/@element-plus/icons-vue"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
