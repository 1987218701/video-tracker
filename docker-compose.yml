services:
  video-tracker:
    build: .
    container_name: video-tracker
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - tracker-data:/data
    environment:
      - FLASK_ENV=production
      - DATABASE_PATH=/data/tracker.db
      - SECRET_KEY=${SECRET_KEY:-please-change-this-secret}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - TMDB_API_BASE=${TMDB_API_BASE:-}
      - TMDB_IMAGE_BASE=${TMDB_IMAGE_BASE:-}
      - TMDB_TIMEOUT=${TMDB_TIMEOUT:-5}

volumes:
  tracker-data:
