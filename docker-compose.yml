services:
  video-tracker:
    build: .
    container_name: video-tracker
    restart: unless-stopped
    ports:
      # 公网部署建议在 .env 里设 BIND_IP=127.0.0.1，再由 Nginx 反向代理对外
      - "${BIND_IP:-0.0.0.0}:${HOST_PORT:-5000}:5000"
    volumes:
      - tracker-data:/data
    environment:
      - FLASK_ENV=production
      - DATABASE_PATH=/data/tracker.db
      - SECRET_KEY=${SECRET_KEY:-please-change-this-secret}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - TMDB_API_BASE=${TMDB_API_BASE:-}
      - TMDB_IMAGE_BASE=${TMDB_IMAGE_BASE:-}
      - TMDB_TIMEOUT=${TMDB_TIMEOUT:-5}
      - TZ_OFFSET_HOURS=${TZ_OFFSET_HOURS:-8}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  tracker-data:
